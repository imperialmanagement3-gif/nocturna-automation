name: 🌧️ NOCTURNA 24/7 - Generate Videos Hourly

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for i in {1..3}; do
            curl -X POST https://nocturna-automation.vercel.app/api/generate-short \
              -H "Content-Type: application/json" \
              -d '{}' &
            sleep 5
          done
          wait
